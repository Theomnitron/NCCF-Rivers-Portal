<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="230" fill="#FFFFFF" stroke="#1D1B68" stroke-width="22" filter="url(#shadow)" />
  <circle cx="250" cy="250" r="216" fill="none" stroke="#1D1B68" stroke-width="4" />

  <!-- Holy Spirit Flame / Red Torch (Top) -->
  <path d="M 250 15 C 290 90, 320 120, 315 180 C 310 230, 280 250, 250 250 C 220 250, 190 230, 185 180 C 180 120, 210 90, 250 15 Z" fill="#D32F2F" />
  <!-- Inner White Dove Silhouette inside Flame -->
  <path d="M 250 110 C 265 140, 275 160, 260 185 C 250 195, 250 205, 250 215 C 250 205, 250 195, 240 185 C 225 160, 235 140, 250 110 Z" fill="#FFFFFF" />

  <!-- Nigerian Flag (Left) -->
  <g transform="translate(120, 190) rotate(-15) scale(0.75)">
    <!-- Pole -->
    <line x1="20" y1="0" x2="20" y2="180" stroke="#1D1B68" stroke-width="8" stroke-linecap="round" />
    <circle cx="20" cy="0" r="8" fill="#1D1B68" />
    <!-- Flag Waves -->
    <path d="M 20 20 C 50 10, 70 30, 100 20 C 100 20, 100 110, 100 110 C 70 120, 50 100, 20 110 Z" fill="#008751" />
    <path d="M 46 17 C 62 12, 70 26, 74 23 L 74 113 C 70 116, 62 102, 46 107 Z" fill="#FFFFFF" />
  </g>

  <!-- Crossed Christian Cross & Staff -->
  <!-- Diagonal Staff/Nail -->
  <line x1="135" y1="360" x2="335" y2="160" stroke="#1D1B68" stroke-width="14" stroke-linecap="round" />
  <circle cx="135" cy="360" r="12" fill="#1D1B68" />
  
  <!-- Diagonal Main Cross -->
  <line x1="165" y1="160" x2="365" y2="360" stroke="#1D1B68" stroke-width="16" stroke-linecap="round" />
  <line x1="220" y1="315" x2="350" y2="185" stroke="#1D1B68" stroke-width="16" stroke-linecap="round" />

  <!-- Open Bible (Base) -->
  <g transform="translate(250, 390)">
    <!-- Left Page -->
    <path d="M 0 0 C -40 -15, -90 -10, -120 10 L -115 35 C -85 15, -40 10, 0 25 Z" fill="#FFFFFF" stroke="#1D1B68" stroke-width="6" />
    <!-- Right Page -->
    <path d="M 0 0 C 40 -15, 90 -10, 120 10 L 115 35 C 85 15, 40 10, 0 25 Z" fill="#FFFFFF" stroke="#1D1B68" stroke-width="6" />
  </g>

  <!-- Ribbon Banner with "nccf" at bottom -->
  <g transform="translate(0, 30)">
    <path d="M 160 380 C 200 405, 300 405, 340 380 C 365 390, 365 425, 360 435 C 300 460, 200 460, 140 435 C 135 425, 135 390, 160 380 Z" fill="#FFFFFF" stroke="#1D1B68" stroke-width="7" />
    <!-- Ribbon ends -->
    <path d="M 140 435 L 125 400 L 160 380 Z" fill="#1D1B68" />
    <path d="M 360 435 L 375 400 L 340 380 Z" fill="#1D1B68" />
    
    <!-- Text "nccf" -->
    <text x="250" y="428" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="44" fill="#D32F2F" text-anchor="middle" letter-spacing="4">nccf</text>
  </g>
</svg>
